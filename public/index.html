<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دومينو الصحاب</title><style>*{box-sizing:border-box}body{margin:0;background:#092a26;color:#fff;font-family:system-ui,Tahoma,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{color:#eecb77}button,input{font:inherit;border-radius:12px;padding:12px;border:0}input{background:#fff;color:#123;max-width:100%;margin:4px}button{background:#eecb77;color:#17322b;font-weight:700;cursor:pointer;margin:4px}button:disabled{opacity:.4}section{background:#16483f;border:1px solid #397267;padding:20px;border-radius:18px;margin:14px 0}.hidden{display:none}.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px}.tile{background:#f9f2db;color:#102e28;border:3px solid #c9bb98;border-radius:9px;display:inline-flex;align-items:center;gap:8px;padding:10px;min-width:64px;justify-content:center;font-size:24px;font-weight:900;box-shadow:0 3px 0 #867b63}.tile i{height:32px;border-left:2px solid #9b9585}.tile.selected{outline:4px solid #ffc54b}.muted{color:#bbd4cd}#toast{color:#ffdb91;min-height:24px}.player{padding:9px;background:#21584d;border-radius:10px;margin:5px}.active{outline:2px solid #eecb77}#board{padding:20px;background:#0d3c34;border-radius:16px;min-height:110px;direction:ltr;align-content:center}#board .tile{font-size:17px;min-width:48px;padding:7px}small{display:block;margin-top:10px;color:#c9dfd6}</style></head><body><main><h1>🁣 دومينو الصحاب</h1><p class="muted">غرفة خاصة بكود • من 2 إلى 4 لاعبين • العب من أي موبايل</p><section id="entry"><input id="name" placeholder="اسمك" maxlength="18"><div><button id="create">إنشاء غرفة</button></div><input id="code" placeholder="كود الغرفة" maxlength="6"><button id="join">دخول الغرفة</button></section><section id="room" class="hidden"><h2>الغرفة: <span id="roomCode"></span></h2><button id="copy">نسخ كود الغرفة</button><div id="players"></div><button id="start" class="hidden">ابدأ المباراة</button><p id="status"></p></section><section id="game" class="hidden"><h3>طاولة اللعب</h3><div id="board" class="tiles"></div><p id="ends"></p><h3>قطعك</h3><div id="hand" class="tiles"></div><p id="turn"></p><div style="text-align:center"><button id="left">العب يسار</button><button id="right">العب يمين</button><button id="draw">اسحب من السوق</button><button id="pass">مرر الدور</button></div><small id="stock"></small></section><p id="toast" role="status"></p><small>قواعد دومينو السحب: 28 قطعة، 7 لكل لاعب، السحب عند عدم وجود قطعة مناسبة، وحسم الجولة بالنقاط عند الإغلاق. عند خروج لاعب تنتهي الجولة الحالية.</small></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id);let state=null,selected=null;function msg(t){$('toast').textContent=t;setTimeout(()=>{if($('toast').textContent===t)$('toast').textContent=''},4000)}function tile(t,i,clickable){let b=document.createElement('button');b.className='tile'+(selected===i&&clickable?' selected':'');b.innerHTML=`<span>${t[0]}</span><i></i><span>${t[1]}</span>`;if(clickable)b.onclick=()=>{selected=i;render()};else b.disabled=true;return b}function render(){if(!state)return;$('entry').classList.add('hidden');$('room').classList.remove('hidden');$('roomCode').textContent=state.code;$('players').innerHTML='';state.players.forEach(p=>{let d=document.createElement('div');d.className='player'+(p.id===state.turn?' active':'');d.textContent=`${p.name} — ${p.count} قطع — ${p.score} نقطة${p.id===state.host?' 👑':''}`;$('players').append(d)});$('start').classList.toggle('hidden',state.me===undefined||state.phase==='playing'||s.id!==state.host);$('start').disabled=state.players.length<2;$('game').classList.toggle('hidden',state.phase!=='playing');$('status').textContent=state.phase==='lobby'?'مستنيين الصحاب يدخلوا الغرفة':state.phase==='finished'?'الفائز: '+state.winner:'المباراة شغالة';if(state.phase!=='playing')return;$('board').innerHTML='';state.board.forEach(t=>$('board').append(tile(t,0,false)));$('ends').textContent=state.ends?'الأطراف: '+state.ends.join(' | '):'الطاولة فاضية — العب أي قطعة';$('hand').innerHTML='';state.me.forEach((t,i)=>$('hand').append(tile(t,i,true)));let mine=state.turn===s.id;$('turn').textContent=mine?'دورك الآن':'دور '+(state.players.find(p=>p.id===state.turn)?.name||'');$('stock').textContent='قطع السوق: '+state.stock;['left','right'].forEach(id=>$(id).disabled=!mine||selected===null);$('draw').disabled=!mine||state.stock===0;$('pass').disabled=!mine||state.stock>0}
s.on('state',v=>{state=v;if(selected!==null&&selected>=v.me.length)selected=null;render()});s.on('errorMsg',msg);$('create').onclick=()=>s.emit('create',{name:$('name').value},r=>r.error?msg(r.error):msg('تم إنشاء الغرفة'));$('join').onclick=()=>s.emit('join',{name:$('name').value,code:$('code').value},r=>r.error?msg(r.error):msg('دخلت الغرفة'));$('start').onclick=()=>s.emit('start');['left','right'].forEach(id=>$(id).onclick=()=>{if(selected===null)return;s.emit('play',{index:selected,side:id});selected=null});$('draw').onclick=()=>s.emit('draw');$('pass').onclick=()=>s.emit('pass');$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(state.code);msg('تم نسخ الكود')}catch{msg('كود الغرفة: '+state.code)}};
</script></body></html>
